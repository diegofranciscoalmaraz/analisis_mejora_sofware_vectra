[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vectra-propuesta-nacho"
version = "1.0.0"
description = "Prototipo didáctico para la propuesta Nacho de VECTRA"
requires-python = ">=3.11"
license = { text = "Uso académico; consultar autores originales para distribución" }

[tool.setuptools.packages.find]
include = ["vectra*"]
